<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FBS Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #0f172a;
    }

    #app-shell {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #top-header-bar {
      width: 100%;
      box-sizing: border-box;
      z-index: 1100;
    }

    #dashboard-wrapper {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* Left Sidebar Tree */
    #sidebar {
      width: 340px;
      background: #ffffff;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Center Map Container */
    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map { width: 100%; height: 100%; }

    /* Right Explorer Panel */
    #explorer-panel {
      width: 380px;
      background: #ffffff;
      height: 100%;
      box-shadow: -4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
      overflow-y: auto;
      flex-shrink: 0;
    }

    @media (max-width: 1100px) {
      html, body {
        overflow-y: auto;
        height: auto;
      }
      #app-shell {
        height: auto;
        min-height: 100vh;
      }
      #dashboard-wrapper {
        flex-direction: column;
        height: auto;
        flex: none;
      }

      /* Map at top on mobile */
      #map-container {
        height: 36vh !important;
        min-height: 240px;
        order: 1;
        width: 100%;
        flex: none;
      }

      /* Filters pane immediately below map */
      #sidebar {
        width: 100% !important;
        height: auto !important;
        max-height: none !important;
        order: 2;
        display: flex !important;
        flex: none;
        box-shadow: none;
        border-bottom: 2px solid #cbd5e1;
      }
      #sidebar .sidebar-content {
        overflow-y: visible;
        max-height: none;
      }

      /* Detail / List pane immediately below filters pane and always visible */
      #explorer-panel {
        width: 100% !important;
        height: auto !important;
        min-height: 260px;
        order: 3;
        display: flex !important;
        flex: none;
        overflow-y: visible;
        box-shadow: none;
      }
    }

    .sidebar-header, .panel-header {
      display: none !important;
    }

    /* Prominent Navigation Bars matching heading style */
    .nav-bar-banner {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .filter-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      flex: 1;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-action:hover { background: #f1f5f9; color: #0f172a; }
    .btn-action.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
      font-weight: 700;
      box-shadow: 0 0 0 1.5px rgba(2, 132, 199, 0.4);
    }

    /* Fixed scrolling container for sidebar tree */
    .sidebar-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-heading {
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 4px 0 2px 4px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
      flex-shrink: 0;
    }

    .panel-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .venue-photo-container {
      width: 100%;
      height: 130px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .venue-photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      padding: 12px;
    }

    .team-title { font-size: 15px; font-weight: 800; color: #0f172a; margin: 0; }
    .team-subtitle { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-top: 1px; }

    .conf-badge-large {
      display: inline-block;
      font-weight: 800;
      font-size: 9px;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
    }

    .info-label { font-size: 8px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .info-value { font-size: 11px; font-weight: 700; color: #0f172a; margin-top: 1px; }

    .notes-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10px;
      color: #334155;
      line-height: 1.35;
    }

    #explorer-panel .nav-bar-banner {
      background: #f1f5f9;
      color: #0f172a;
      border-top: 1px solid #cbd5e1;
      box-shadow: none;
      padding: 8px 12px;
      margin-top: auto;
    }

    .back-conf-btn {
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      flex: 1;
      box-sizing: border-box;
    }
    .back-conf-btn:hover { background: #e2e8f0; color: #0f172a; }

    .filter-card-box {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #ffffff;
      flex-shrink: 0;
    }
    .filter-card-header {
      background: #f8fafc;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
    }
    .filter-card-header:hover { background: #f1f5f9; }
    .filter-card-body {
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      border-radius: 0 0 6px 6px;
      padding: 8px 10px;
    }

    .conf-preset-btn {
      background: #334155;
      border: 1.5px solid #475569;
      color: #ffffff;
      border-radius: 5px;
      padding: 5px 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.15s ease;
    }
    .conf-preset-btn.active {
      background: #0284c7;
      border-color: #0369a1;
      box-shadow: 0 0 0 1.5px rgba(2, 132, 199, 0.35);
    }

    .conf-chip-btn {
      border-radius: 5px;
      padding: 4px 5px;
      font-size: 9.5px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      border: 1.5px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conf-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
    }

    .conf-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    .conf-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }

    .game-feed-item {
      border: 1px solid #e2e8f0;
      border-left-width: 4px;
      border-radius: 6px;
      padding: 6px 8px;
      background: #f8fafc;
      font-size: 10px;
      color: #334155;
      line-height: 1.35;
    }
    .game-conf-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .game-feed-team {
      font-weight: 800;
      color: #0284c7;
      cursor: pointer;
      text-decoration: none;
    }
    .game-feed-team:hover { text-decoration: underline; }
    .game-feed-meta {
      font-size: 9px;
      color: #64748b;
      font-weight: 600;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div id="app-shell">
    <div class="nav-bar-banner" id="top-header-bar">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span>NCAA FBS</span>
        <span id="active-count" style="font-size: 11px; font-weight: 600; opacity: 0.9;">Loading...</span>
      </div>
    </div>

    <div id="dashboard-wrapper">
      <!-- Left Sidebar: FBS Conferences & Upcoming Home Games -->
      <div id="sidebar">
        <div class="sidebar-content" id="sidebar-tree-wrap" style="gap: 8px;">
          <div id="conferences-slot" style="display:flex; flex-direction:column;"></div>
          <div class="filter-card-box" id="home-games-dropdown-group">
            <div class="filter-card-header" id="home-games-dropdown-toggle">
              <span>Upcoming Home Games</span>
              <span id="home-games-dropdown-arrow" style="font-size:9px; color:#64748b;">▼</span>
            </div>
            <div class="filter-card-body" id="home-games-dropdown-body" style="display:none; flex-direction:column; gap:6px;">
              <div style="display:flex; gap:4px; width:100%;">
                <button class="btn-action active" id="btn-reset-dates" style="background:#0284c7; border-color:#0369a1; color:#fff;">None</button>
                <button class="btn-action" id="btn-today" style="background:#334155; border-color:#475569; color:#fff;">Today</button>
                <button class="btn-action" id="btn-next-3-days" style="background:#334155; border-color:#475569; color:#fff;">Next 3 Days</button>
              </div>
              <div style="display:flex; gap:4px; width:100%; align-items:center;">
                <input type="date" id="date-start" title="Start date" style="flex:1; min-width:0; background:#f8fafc; color:#0f172a; border:1px solid #cbd5e1; border-radius:4px; padding:3px 5px; font-size:10px; font-weight:600;">
                <span style="font-size:10px; color:#64748b;">to</span>
                <input type="date" id="date-end" title="End date (optional)" style="flex:1; min-width:0; background:#f8fafc; color:#0f172a; border:1px solid #cbd5e1; border-radius:4px; padding:3px 5px; font-size:10px; font-weight:600;">
                <button class="btn-action" id="btn-apply-dates" style="flex:0 0 auto; padding:3px 8px; background:#334155; border-color:#475569; color:#fff;">Go</button>
              </div>
            </div>
          </div>
          <div id="sidebar-tree" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>
      </div>

      <!-- Center Map -->
      <div id="map-container">
        <div id="map"></div>
      </div>

      <!-- Right Explorer Panel -->
      <div id="explorer-panel">
        <div class="panel-body" id="panel-content">
          <div class="photo-placeholder">Select a filter for Conferences or Upcoming Home Games to see more.</div>
        </div>
        <div class="nav-bar-banner" id="detail-nav-bar" style="display: none;">
          <div style="display: flex; gap: 4px; width: 100%;">
            <button class="back-conf-btn" id="back-to-conf-btn">&larr; Reset View</button>
            <button class="back-conf-btn" id="prev-venue-btn">Previous</button>
            <button class="back-conf-btn" id="next-venue-btn">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1XHaT57dHhRLtMojDEXhMn8AMScxz5F7WBe1i8y6NIe4";
    const SHEET_NAME = "NCAA FBS";

    const CONFERENCE_COLORS = {
      "ACC": "#0284c7",           /* Sky Blue */
      "Big Ten": "#1d4ed8",       /* Royal Blue */
      "Big 12": "#dc2626",        /* Crimson Red */
      "SEC": "#d97706",           /* Amber Gold */
      "AAC": "#0d9488",           /* Teal */
      "CUSA": "#e11d48",          /* Rose */
      "MAC": "#22c55e",           /* Light Green */
      "Mountain West": "#7c3aed", /* Violet */
      "Pac-12": "#059669",        /* Emerald Green */
      "Sun Belt": "#ea580c",      /* Bright Orange */
      "Independent": "#64748b"    /* Gray Shade */
    };

    const POWER_4_ORDER = ["ACC", "Big Ten", "Big 12", "SEC"];
    const GROUP_OF_6_ORDER = ["AAC", "CUSA", "MAC", "Mountain West", "Pac-12", "Sun Belt"];
    const CONF_ROW_2_ORDER = ["AAC", "CUSA", "MAC", "Mountain West"];
    const CONF_ROW_3_ORDER = ["Pac-12", "Sun Belt", "Independent"];

    const CONFERENCE_BUTTON_LABELS = {
      "Mountain West": "MW",
      "Independent": "Ind"
    };

    function getConferenceButtonLabel(conf) {
      return CONFERENCE_BUTTON_LABELS[conf] || conf;
    }

    const POWER_4 = new Set(POWER_4_ORDER);
    const GROUP_OF_6 = new Set(GROUP_OF_6_ORDER);

    const ESPN_FBS_SCOREBOARD_URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";

    let scheduleLoaded = false;
    let activeDateRangeLabel = 'Today';
    let dateWindowActive = false;
    let nextHomeLookupLoaded = false;
    const MAX_RANGE_DAYS = 14;
    const NEXT_HOME_LOOKAHEAD_DAYS = 45;

    function formatIsoLocalDate(dt) {
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const d = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getLocalDateYMD(isoStr) {
      if (isoStr) return isoStr.replace(/-/g, '');
      return formatIsoLocalDate(new Date()).replace(/-/g, '');
    }

    function enumerateDatesYMD(startIso, endIso, maxDays = MAX_RANGE_DAYS) {
      const startStr = startIso || formatIsoLocalDate(new Date());
      const endStr = endIso || startStr;
      const [sy, sm, sd] = startStr.split('-').map(Number);
      const [ey, em, ed] = endStr.split('-').map(Number);
      let cur = new Date(sy, sm - 1, sd);
      let end = new Date(ey, em - 1, ed);
      if (isNaN(cur.getTime()) || isNaN(end.getTime())) return [getLocalDateYMD()];
      if (end < cur) { const tmp = cur; cur = end; end = tmp; }

      const dates = [];
      for (let i = 0; i < maxDays && cur <= end; i++) {
        dates.push(getLocalDateYMD(formatIsoLocalDate(cur)));
        cur.setDate(cur.getDate() + 1);
      }
      return dates;
    }

    function normalizeCollegeKey(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/ (university of|the|at) /g, ' ')
        .replace(/ st\.? /g, 'state')
        .replace(/[^a-z0-9 ]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatGameTime(isoDateStr) {
      if (!isoDateStr) return '';
      const dt = new Date(isoDateStr);
      if (isNaN(dt.getTime())) return '';
      return dt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function formatShortDay(ymdStr) {
      if (!ymdStr || ymdStr.length !== 8) return ymdStr;
      const dt = new Date(Number(ymdStr.slice(0, 4)), Number(ymdStr.slice(4, 6)) - 1, Number(ymdStr.slice(6, 8)));
      return dt.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function venueMatchesHomeGame(v, g) {
      const collegeLower = (v.college || '').toLowerCase().trim();
      const fullTeamLower = `${v.college || ''} ${v.mascot || ''}`.toLowerCase().trim();
      const collegeNorm = normalizeCollegeKey(v.college);

      const candidates = [
        g.homeName,
        g.homeDisplayName,
        g.homeShortName,
        g.homeLocation
      ].filter(Boolean);

      for (const rawCand of candidates) {
        const candLower = rawCand.toLowerCase().trim();
        const candNorm = normalizeCollegeKey(rawCand);
        if (
          candLower === collegeLower ||
          candLower === fullTeamLower ||
          (collegeNorm && candNorm && candNorm === collegeNorm)
        ) {
          return true;
        }
      }
      return false;
    }

    function formatGameSummaryLine(g) {
      const dayPart = g.ymd ? `${formatShortDay(g.ymd)} ` : '';
      const timePart = g.gameTime ? ` ${g.gameTime}` : '';
      const rawStatus = (g.statusDetail || '').trim();
      const isDateTimestamp = /\d{1,2}\/\d{1,2}| (AM|PM|EST|EDT|CST|CDT|MST|MDT|PST|PDT) /i.test(rawStatus);
      const statusPart = rawStatus && rawStatus !== 'Scheduled' && !isDateTimestamp ? ` • ${rawStatus}` : '';
      return `${dayPart}${g.awayShortName || g.awayDisplayName} @ ${g.homeShortName || g.homeDisplayName}${timePart}${statusPart}`;
    }

    function applyScheduleToVenues() {
      if (!venues.length) return;
      venues.forEach(v => {
        v.isPlayingInWindow = false;
        v.windowGames = [];
        v.windowGameEntries = [];
      });

      if (!Array.isArray(window._espnFbsGames)) return;

      venues.forEach(v => {
        const seen = new Set();
        for (const g of window._espnFbsGames) {
          if (venueMatchesHomeGame(v, g)) {
            v.isPlayingInWindow = true;
            const line = formatGameSummaryLine(g);
            if (!seen.has(line)) {
              seen.add(line);
              v.windowGames.push(line);
              v.windowGameEntries.push({
                team: v.college,
                fullName: `${v.college} ${v.mascot}`.trim(),
                conference: v.conference,
                venue: v.venue,
                line,
                ymd: g.ymd || '',
                isoDate: g.isoDate || ''
              });
            }
          }
        }
      });
    }

    async function parseFbsScoreboardDate(ymd) {
      try {
        const resp = await fetch(`${ESPN_FBS_SCOREBOARD_URL}?dates=${ymd}&limit=200`);
        if (!resp.ok) return [];
        const data = await resp.json();
        const events = Array.isArray(data.events) ? data.events : [];
        const parsed = [];

        events.forEach(ev => {
          const comp = ev.competitions && ev.competitions[0];
          const competitors = (comp && comp.competitors) || [];
          const home = competitors.find(c => c.homeAway === 'home');
          const away = competitors.find(c => c.homeAway === 'away');
          if (!home || !away) return;

          const homeTeam = home.team || {};
          const awayTeam = away.team || {};
          const statusDetail = (ev.status && ev.status.type && ev.status.type.shortDetail) || '';

          parsed.push({
            ymd,
            isoDate: ev.date || '',
            homeName: homeTeam.name || '',
            homeDisplayName: homeTeam.displayName || homeTeam.name || '',
            homeShortName: homeTeam.shortDisplayName || homeTeam.name || '',
            homeLocation: homeTeam.location || '',
            awayDisplayName: awayTeam.displayName || awayTeam.name || '',
            awayShortName: awayTeam.shortDisplayName || awayTeam.name || '',
            gameTime: formatGameTime(ev.date),
            statusDetail
          });
        });

        return parsed;
      } catch (err) {
        return [];
      }
    }

    async function fetchNextHomeGamesForAllVenues() {
      const startDt = new Date();
      const endDt = new Date();
      endDt.setDate(endDt.getDate() + NEXT_HOME_LOOKAHEAD_DAYS);
      const ymdList = enumerateDatesYMD(formatIsoLocalDate(startDt), formatIsoLocalDate(endDt), NEXT_HOME_LOOKAHEAD_DAYS);
      const allGames = [];

      await Promise.all(
        ymdList.map(async (ymd) => {
          const list = await parseFbsScoreboardDate(ymd);
          allGames.push(...list);
        })
      );

      window._espnFbsUpcomingGames = allGames;
      nextHomeLookupLoaded = true;
      assignNextHomeGamesToVenues();
    }

    function assignNextHomeGamesToVenues() {
      if (!venues.length || !Array.isArray(window._espnFbsUpcomingGames)) return;
      const nowMs = Date.now() - 4 * 3600 * 1000;

      venues.forEach(v => {
        const games = window._espnFbsUpcomingGames
          .filter(g => venueMatchesHomeGame(v, g))
          .sort((a, b) => {
            const ta = Date.parse(a.isoDate || '') || Number(a.ymd + '0000');
            const tb = Date.parse(b.isoDate || '') || Number(b.ymd + '0000');
            return ta - tb;
          });

        const upcoming = games.find(g => {
          const ts = Date.parse(g.isoDate || '');
          return isNaN(ts) ? g.ymd >= getLocalDateYMD() : ts >= nowMs;
        }) || games[0] || null;

        v.nextHomeGame = upcoming ? formatGameSummaryLine(upcoming) : '';
      });
    }

    async function fetchScoreboardsForRange(startIso, endIso, label = 'Today') {
      const ymdList = enumerateDatesYMD(startIso, endIso);
      const results = [];

      await Promise.all(
        ymdList.map(async (ymd) => {
          const parsed = await parseFbsScoreboardDate(ymd);
          results.push(...parsed);
        })
      );

      window._espnFbsGames = results;
      activeDateRangeLabel = label;
      scheduleLoaded = true;
      applyScheduleToVenues();
      updateMapFilters();
    }

    const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap: true });
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, noWrap: true });

    const initialZoom = window.innerWidth <= 1100 ? 3 : 4;
    const map = L.map('map', { zoomControl: true, minZoom: 3, layers: [osmStandard] }).setView([39.8283, -98.5795], initialZoom);
    let activeBasemapLayer = osmStandard;
    const venueLayer = L.layerGroup().addTo(map);

    let venues = [];
    let storedConferenceGrouped = {};
    let currentFilteredVenues = [];
    let currentVenueIndex = -1;
    let markersMap = {};

    // Independent filter states matching Pro Map structure
    let activeConferencePreset = 'all'; // 'all' | 'power4' | 'group6'
    let selectedConference = null;
    let todayOnlyMode = false;
    let activeDatePreset = 'none'; // 'none' | 'today' | 'next3' | 'custom'
    let hasUserFiltered = false;
    let conferencesSectionExpanded = true;

    function getNationalZoom() {
      return window.innerWidth <= 1100 ? 3 : 4;
    }

    function updateBasemapForZoom() {
      const currentZoom = map.getZoom();
      let targetLayer = currentZoom <= 6 ? osmStandard : esriSatellite;
      if (activeBasemapLayer !== targetLayer) {
        if (map.hasLayer(activeBasemapLayer)) map.removeLayer(activeBasemapLayer);
        map.addLayer(targetLayer);
        activeBasemapLayer = targetLayer;
      }
    }

    function showMobilePanel(panelType) {
      if (window.innerWidth <= 1100 && panelType === 'explorer') {
        const explorer = document.getElementById('explorer-panel');
        if (explorer) explorer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      setTimeout(() => { map.invalidateSize(); }, 100);
    }

    function parseGameSortKey(entry) {
      const ts = Date.parse(entry.isoDate || '');
      if (!isNaN(ts)) return ts;
      return Number((entry.ymd || '99999999') + '0000');
    }

    function getActiveScopeLabel() {
      if (selectedConference) return selectedConference;
      if (activeConferencePreset === 'power4') return 'Power 4';
      if (activeConferencePreset === 'group6') return 'Group of 6';
      return 'All Conferences';
    }

    function buildTeamsAndVenuesFeedHtml() {
      const label = `${getActiveScopeLabel()} Teams & Venues`;

      const sortedVenues = [...currentFilteredVenues].sort((a, b) => a.college.localeCompare(b.college));
      if (!sortedVenues.length) {
        return `
          <div style="margin-top:2px;">
            <div class="section-heading" style="margin-left:0;">${label}</div>
            <div class="photo-placeholder" style="padding:8px 4px;">No teams found for this selection.</div>
          </div>
        `;
      }

      const itemsHtml = sortedVenues.map(v => {
        const safeCollege = v.college.replace(/'/g, "\'");
        const color = CONFERENCE_COLORS[v.conference] || "#475569";
        const displayLabel = `${v.college} ${v.mascot}`.trim();
        return `
          <div class="game-feed-item" style="border-left-color:${color}; background:${color}10;">
            <div style="display:flex; align-items:center; gap:5px;">
              <span class="game-conf-dot" style="background:${color};"></span>
              <span class="game-feed-team" onclick="focusTeamFromScheduleFeed('${safeCollege}')">${displayLabel}</span>
              <span style="font-size:9px; font-weight:700; color:#475569;"> (${v.conference})</span>
            </div>
            <div style="font-weight:600; color:#1e293b; margin-top:1px;">${v.venue}</div>
            <div class="game-feed-meta">${v.venueCity}</div>
          </div>
        `;
      }).join('');

      return `
        <div style="margin-top:2px;">
          <div class="section-heading" style="margin-left:0;">${label} (${sortedVenues.length})</div>
          <div style="display:flex; flex-direction:column; gap:6px;">${itemsHtml}</div>
        </div>
      `;
    }

    function buildScheduledGamesFeedHtml() {
      if (!dateWindowActive) {
        return buildTeamsAndVenuesFeedHtml();
      }

      const entries = [];
      currentFilteredVenues.forEach(v => {
        if (v.windowGameEntries && v.windowGameEntries.length) {
          v.windowGameEntries.forEach(entry => entries.push(entry));
        }
      });

      entries.sort((a, b) => {
        const diff = parseGameSortKey(a) - parseGameSortKey(b);
        if (diff !== 0) return diff;
        return a.team.localeCompare(b.team);
      });

      const scopePrefix = selectedConference ? `${getActiveScopeLabel()} ` : '';
      const headingText = `${scopePrefix}Upcoming Home Games (${activeDateRangeLabel})`;

      if (!entries.length) {
        return `
          <div style="margin-top:2px;">
            <div class="section-heading" style="margin-left:0;">${headingText}</div>
            <div class="photo-placeholder" style="padding:8px 4px;">No scheduled home games found for the selected filter and dates.</div>
          </div>
        `;
      }

      const itemsHtml = entries.map(e => {
        const safeCollege = e.team.replace(/'/g, "\'");
        const color = CONFERENCE_COLORS[e.conference] || "#475569";
        return `
          <div class="game-feed-item" style="border-left-color:${color}; background:${color}10;">
            <div style="display:flex; align-items:center; gap:5px;">
              <span class="game-conf-dot" style="background:${color};"></span>
              <span class="game-feed-team" onclick="focusTeamFromScheduleFeed('${safeCollege}')">${e.fullName || e.team}</span>
              <span style="font-size:9px; font-weight:700; color:#475569;"> (${e.conference})</span>
            </div>
            <div>${e.line}</div>
            <div class="game-feed-meta">${e.venue}</div>
          </div>
        `;
      }).join('');

      return `
        <div style="margin-top:2px;">
          <div class="section-heading" style="margin-left:0;">${headingText} (${entries.length})</div>
          <div style="display:flex; flex-direction:column; gap:6px;">${itemsHtml}</div>
        </div>
      `;
    }

    window.focusTeamFromScheduleFeed = function(collegeName) {
      const target = currentFilteredVenues.find(item => item.college === collegeName) || venues.find(item => item.college === collegeName);
      if (!target) return;
      const globalIdx = currentFilteredVenues.findIndex(item => item.college === target.college);
      map.flyTo(target.coords, 15, { duration: 0.8 });
      if (markersMap[target.college]) markersMap[target.college].openPopup();
      showVenueDetails(target, globalIdx);
    };

    function setDetailNavVisible(visible) {
      const navEl = document.getElementById('detail-nav-bar');
      if (navEl) navEl.style.display = visible ? 'flex' : 'none';
    }

    function renderEmptyDetailMessage() {
      return '<div class="photo-placeholder">Select a filter for Conferences or Upcoming Home Games to see more.</div>';
    }

    function resetRightPanel() {
      currentVenueIndex = -1;
      setDetailNavVisible(false);
      const panelContent = document.getElementById('panel-content');
      if (!hasUserFiltered) {
        panelContent.innerHTML = renderEmptyDetailMessage();
        return;
      }
      const feedHtml = buildScheduledGamesFeedHtml();
      panelContent.innerHTML = feedHtml && feedHtml.trim() ? feedHtml : renderEmptyDetailMessage();
    }

    async function fetchWikiImage(wikiUrl, venueName) {
      let titles = [];
      if (wikiUrl && wikiUrl.includes('/wiki/')) {
        let slug = wikiUrl.split('/wiki/')[1].split('#')[0].split('?')[0];
        titles.push(slug);
      }
      titles.push(encodeURIComponent(venueName));

      for (let t of titles) {
        const apiUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=600&redirects=1&titles=${t}&origin=*`;
        try {
          const response = await fetch(apiUrl);
          const data = await response.json();
          if (data.query && data.query.pages) {
            const pages = data.query.pages;
            for (let id in pages) {
              if (pages[id].thumbnail && pages[id].thumbnail.source) {
                return pages[id].thumbnail.source;
              }
            }
          }
        } catch (e) {
          console.log("Wiki fetch error for title:", t);
        }
      }
      return null;
    }

    async function showVenueDetails(v, index = -1) {
      setDetailNavVisible(true);
      if (index !== -1) {
        currentVenueIndex = index;
      } else {
        currentVenueIndex = currentFilteredVenues.findIndex(item => item.college === v.college);
      }

      const color = CONFERENCE_COLORS[v.conference] || "#475569";
      const capacityStr = v.capacity ? Number(v.capacity).toLocaleString() : 'N/A';
      const windowGameList = Array.isArray(v.windowGames) ? v.windowGames : [];
      const uniqueWindowGames = windowGameList.filter(line => line !== v.nextHomeGame);

      const panelContent = document.getElementById('panel-content');
      panelContent.innerHTML = `
        <div id="photo-slot"></div>
        <div>
          <span class="conf-badge-large" style="background:${color};">${v.conference}</span>
          <h2 class="team-title">${v.college} ${v.mascot}</h2>
          <div class="team-subtitle">${v.venueCity}</div>
        </div>
        <div class="info-grid">
          <div class="info-card">
            <div class="info-label">Venue Name</div>
            <div class="info-value" style="font-size: 11px; margin-top:2px;">${v.venue}</div>
          </div>
          <div class="info-card">
            <div class="info-label">Capacity</div>
            <div class="info-value">${capacityStr}</div>
          </div>
        </div>
        ${v.nextHomeGame ? `<div class="notes-box" style="background:${color}14; border-color:${color}66; border-left:4px solid ${color}; color:#0f172a;"><b>Next Home Game:</b> ${v.nextHomeGame}</div>` : ''}
        ${uniqueWindowGames.length ? `<div class="notes-box" style="background:#e0f2fe; border-color:#bae6fd; color:#0c4a6e;"><b>${activeDateRangeLabel === 'Today' ? "Today's Game" : 'Selected Dates'}:</b><br>${uniqueWindowGames.join('<br>')}</div>` : ''}
        ${v.notes ? `<div class="notes-box"><b>Venue Notes:</b> ${v.notes}</div>` : ''}
      `;

      if (window.innerWidth <= 1100) {
        showMobilePanel('explorer');
      }

      const imgUrl = await fetchWikiImage(v.wikiUrl, v.venue);
      const photoSlot = document.getElementById('photo-slot');
      if (photoSlot && imgUrl) {
        photoSlot.innerHTML = `<div class="venue-photo-container"><img src="${imgUrl}" alt="${v.venue}"></div>`;
      }
    }

    function doesVenueMatchFilters(v, opts = {}) {
      const ignoreConference = Boolean(opts.ignoreConference);
      const ignorePreset = Boolean(opts.ignorePreset);
      const dateActive = todayOnlyMode || dateWindowActive;

      if (!ignoreConference && selectedConference && v.conference !== selectedConference) return false;
      if (!ignorePreset && !selectedConference) {
        if (activeConferencePreset === 'power4' && !POWER_4.has(v.conference)) return false;
        if (activeConferencePreset === 'group6' && !GROUP_OF_6.has(v.conference)) return false;
      }
      if (dateActive && !v.isPlayingInWindow) return false;
      return true;
    }

    function countMatchingItemsForVenue(v) {
      const dateActive = todayOnlyMode || dateWindowActive;
      if (dateActive) {
        return Array.isArray(v.windowGameEntries) ? v.windowGameEntries.length : (v.isPlayingInWindow ? 1 : 0);
      }
      return 1;
    }

    function zoomMapToScope() {
      if (selectedConference && storedConferenceGrouped[selectedConference]) {
        const confTeams = storedConferenceGrouped[selectedConference].filter(v => doesVenueMatchFilters(v, { ignoreConference: true }));
        const targetList = confTeams.length ? confTeams : storedConferenceGrouped[selectedConference];
        const lats = targetList.map(t => t.coords[0]);
        const lngs = targetList.map(t => t.coords[1]);
        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
        if (targetList.length === 1) {
          map.flyTo([(minLat + maxLat) / 2, (minLng + maxLng) / 2], 13, { duration: 0.8 });
        } else {
          map.fitBounds([[minLat, minLng], [maxLat, maxLng]], { padding: [50, 50], maxZoom: 12, duration: 0.8 });
        }
        return;
      }
      map.setView([39.8283, -98.5795], getNationalZoom());
    }

    function syncButtonActiveStyles() {
      const allBtn = document.getElementById('btn-conf-all');
      const p4Btn = document.getElementById('btn-conf-power4');
      const g6Btn = document.getElementById('btn-conf-group6');
      if (allBtn && p4Btn && g6Btn) {
        allBtn.classList.toggle('active', !selectedConference && activeConferencePreset === 'all');
        p4Btn.classList.toggle('active', !selectedConference && activeConferencePreset === 'power4');
        g6Btn.classList.toggle('active', !selectedConference && activeConferencePreset === 'group6');
      }

      document.querySelectorAll('.conf-chip-btn').forEach(btn => {
        const conf = decodeURIComponent(btn.getAttribute('data-conf') || '');
        const color = CONFERENCE_COLORS[conf] || "#475569";
        const isSelected = selectedConference === conf;
        const isIncluded = !selectedConference && (
          activeConferencePreset === 'all' ||
          (activeConferencePreset === 'power4' && POWER_4.has(conf)) ||
          (activeConferencePreset === 'group6' && GROUP_OF_6.has(conf))
        );

        if (isSelected) {
          btn.style.background = color;
          btn.style.color = '#ffffff';
          btn.style.borderColor = '#0f172a';
          btn.style.boxShadow = `0 0 0 1.5px ${color}`;
          btn.style.opacity = '1';
        } else if (isIncluded) {
          btn.style.background = `${color}22`;
          btn.style.color = '#0f172a';
          btn.style.borderColor = color;
          btn.style.boxShadow = 'none';
          btn.style.opacity = '1';
        } else {
          btn.style.background = '#f8fafc';
          btn.style.color = '#64748b';
          btn.style.borderColor = '#cbd5e1';
          btn.style.boxShadow = 'none';
          btn.style.opacity = '0.75';
        }
      });

      ['btn-reset-dates', 'btn-today', 'btn-next-3-days'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const isActive =
          (id === 'btn-reset-dates' && activeDatePreset === 'none') ||
          (id === 'btn-today' && activeDatePreset === 'today') ||
          (id === 'btn-next-3-days' && activeDatePreset === 'next3');
        btn.classList.toggle('active', isActive);
        btn.style.background = isActive ? '#0284c7' : '#334155';
        btn.style.borderColor = isActive ? '#0369a1' : '#475569';
      });
    }

    function createConferenceButtonElement(conf, count) {
      const encodedConf = encodeURIComponent(conf);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'conf-chip-btn';
      btn.setAttribute('data-conf', encodedConf);
      btn.innerHTML = `${getConferenceButtonLabel(conf)} <span class="conf-count-label" data-conf="${encodedConf}">(${count})</span>`;

      btn.addEventListener('click', () => {
        hasUserFiltered = true;
        if (selectedConference === conf) {
          selectedConference = null;
        } else {
          selectedConference = conf;
          activeConferencePreset = 'all';
        }
        syncButtonActiveStyles();
        updateMapFilters();
        zoomMapToScope();
        resetRightPanel();
      });
      return btn;
    }

    function renderSidebarTree(conferenceGrouped) {
      storedConferenceGrouped = conferenceGrouped;

      const confCard = document.createElement('div');
      confCard.className = 'filter-card-box';

      const confHeaderRow = document.createElement('div');
      confHeaderRow.className = 'filter-card-header';
      confHeaderRow.innerHTML = `
        <span>Conferences</span>
        <span id="conferences-section-arrow" style="font-size:9px; color:#64748b;">${conferencesSectionExpanded ? '▲' : '▼'}</span>
      `;
      confCard.appendChild(confHeaderRow);

      const confBodyDiv = document.createElement('div');
      confBodyDiv.id = 'conferences-section-body';
      confBodyDiv.className = 'filter-card-body';
      confBodyDiv.style.display = conferencesSectionExpanded ? 'flex' : 'none';
      confBodyDiv.style.flexDirection = 'column';
      confBodyDiv.style.gap = '4px';

      // Row 0: Preset buttons
      const row0 = document.createElement('div');
      row0.style.display = 'flex';
      row0.style.gap = '4px';
      row0.style.width = '100%';
      row0.innerHTML = `
        <button type="button" class="conf-preset-btn" id="btn-conf-all">All</button>
        <button type="button" class="conf-preset-btn" id="btn-conf-power4">Power 4</button>
        <button type="button" class="conf-preset-btn" id="btn-conf-group6">Group of 6</button>
      `;
      confBodyDiv.appendChild(row0);

      // Row 1 (4 buttons): Power 4
      const row1Grid = document.createElement('div');
      row1Grid.className = 'conf-grid-4';
      POWER_4_ORDER.forEach(conf => {
        if (!conferenceGrouped[conf]) return;
        row1Grid.appendChild(createConferenceButtonElement(conf, conferenceGrouped[conf].length));
      });
      if (row1Grid.children.length) confBodyDiv.appendChild(row1Grid);

      // Row 2 (4 buttons): AAC, CUSA, MAC, MW
      const row2Grid = document.createElement('div');
      row2Grid.className = 'conf-grid-4';
      CONF_ROW_2_ORDER.forEach(conf => {
        if (!conferenceGrouped[conf]) return;
        row2Grid.appendChild(createConferenceButtonElement(conf, conferenceGrouped[conf].length));
      });
      if (row2Grid.children.length) confBodyDiv.appendChild(row2Grid);

      // Row 3 (3 buttons): Pac-12, Sun Belt, Ind
      const row3Grid = document.createElement('div');
      row3Grid.className = 'conf-grid-3';
      CONF_ROW_3_ORDER.forEach(conf => {
        if (!conferenceGrouped[conf]) return;
        row3Grid.appendChild(createConferenceButtonElement(conf, conferenceGrouped[conf].length));
      });
      if (row3Grid.children.length) confBodyDiv.appendChild(row3Grid);

      // Any unexpected extra conferences from sheet
      const placedConfs = new Set([
        ...POWER_4_ORDER,
        ...CONF_ROW_2_ORDER,
        ...CONF_ROW_3_ORDER
      ]);
      const extraConfs = Object.keys(conferenceGrouped).filter(c => !placedConfs.has(c)).sort();
      if (extraConfs.length) {
        const extraGrid = document.createElement('div');
        extraGrid.className = 'conf-grid-2';
        extraConfs.forEach(conf => {
          extraGrid.appendChild(createConferenceButtonElement(conf, conferenceGrouped[conf].length));
        });
        confBodyDiv.appendChild(extraGrid);
      }

      confHeaderRow.addEventListener('click', () => {
        conferencesSectionExpanded = !conferencesSectionExpanded;
        confBodyDiv.style.display = conferencesSectionExpanded ? 'flex' : 'none';
        document.getElementById('conferences-section-arrow').textContent = conferencesSectionExpanded ? '▲' : '▼';
      });

      confCard.appendChild(confBodyDiv);
      const confSlot = document.getElementById('conferences-slot');
      confSlot.innerHTML = '';
      confSlot.appendChild(confCard);

      document.getElementById('btn-conf-all').addEventListener('click', () => {
        hasUserFiltered = true;
        activeConferencePreset = 'all';
        selectedConference = null;
        syncButtonActiveStyles();
        updateMapFilters();
        zoomMapToScope();
        resetRightPanel();
      });

      document.getElementById('btn-conf-power4').addEventListener('click', () => {
        hasUserFiltered = true;
        activeConferencePreset = 'power4';
        selectedConference = null;
        syncButtonActiveStyles();
        updateMapFilters();
        zoomMapToScope();
        resetRightPanel();
      });

      document.getElementById('btn-conf-group6').addEventListener('click', () => {
        hasUserFiltered = true;
        activeConferencePreset = 'group6';
        selectedConference = null;
        syncButtonActiveStyles();
        updateMapFilters();
        zoomMapToScope();
        resetRightPanel();
      });

      syncButtonActiveStyles();
      updateDynamicFilterCounts();
    }

    function updateDynamicFilterCounts() {
      document.querySelectorAll('.conf-count-label').forEach(el => {
        const conf = decodeURIComponent(el.getAttribute('data-conf') || '');
        const list = storedConferenceGrouped[conf] || [];
        let total = 0;
        list.forEach(v => {
          if (doesVenueMatchFilters(v, { ignoreConference: true, ignorePreset: true })) {
            total += countMatchingItemsForVenue(v);
          }
        });
        el.textContent = `(${total})`;
      });
    }

    function updateMapFilters() {
      venueLayer.clearLayers();
      markersMap = {};
      currentFilteredVenues = venues.filter(v => doesVenueMatchFilters(v));

      if (currentVenueIndex === -1) {
        resetRightPanel();
      }

      currentFilteredVenues.forEach(v => {
        const color = CONFERENCE_COLORS[v.conference] || "#475569";
        const marker = L.circleMarker(v.coords, {
          radius: 6.5, fillColor: color, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 0.95
        }).addTo(venueLayer);

        marker.on('click', () => {
          const globalIdx = currentFilteredVenues.findIndex(item => item.college === v.college);
          map.flyTo(v.coords, 15, { duration: 0.8 });
          showVenueDetails(v, globalIdx);
        });

        markersMap[v.college] = marker;
      });

      updateDynamicFilterCounts();
      document.getElementById('active-count').textContent = `${currentFilteredVenues.length} of ${venues.length} teams shown`;
      updateBasemapForZoom();
    }

    function clearDateSelectionState() {
      todayOnlyMode = false;
      dateWindowActive = false;
      activeDatePreset = 'none';
      window._espnFbsGames = null;
      document.getElementById('date-start').value = '';
      document.getElementById('date-end').value = '';
      syncButtonActiveStyles();
    }

    function setDateFilterState(preset) {
      hasUserFiltered = true;
      todayOnlyMode = true;
      dateWindowActive = true;
      activeDatePreset = preset;
      syncButtonActiveStyles();
      resetRightPanel();
    }

    window.handleGvizResponse = function(response) {
      if (!response || !response.table) return;
      const cols = response.table.cols.map((c, idx) => (c && c.label) ? c.label.trim() : String.fromCharCode(65 + idx));
      const rawRows = response.table.rows.map(r => {
        let rowObj = {};
        if (r && r.c) {
          r.c.forEach((cell, idx) => {
            rowObj[cols[idx] || String.fromCharCode(65 + idx)] = (cell && cell.v !== null) ? cell.v : '';
          });
        }
        return rowObj;
      });

      function getRowVal(row, possibleKeys) {
        for (let key of possibleKeys) {
          for (let rk in row) {
            if (rk.trim().toLowerCase() === key.toLowerCase()) return row[rk];
          }
        }
        return '';
      }

      venues = [];
      const conferenceGrouped = {};

      rawRows.forEach(row => {
        const conf = String(getRowVal(row, ['FBS Conference', 'Conference']) || '').trim();
        const college = String(getRowVal(row, ['College/University Name', 'College', 'Team Name']) || '').trim();
        const mascot = String(getRowVal(row, ['Mascot']) || '').trim();
        const venueName = String(getRowVal(row, ['Venue Name', 'Venue']) || '').trim();
        const venueCity = String(getRowVal(row, ['Venue City', 'City']) || '').trim();
        const capacity = getRowVal(row, ['Venue Capacity for Football', 'Capacity']);
        const notes = String(getRowVal(row, ['Notes (as needed)', 'Notes']) || '').trim();
        const lat = parseFloat(getRowVal(row, ['Latitude', 'Lat']));
        const lng = parseFloat(getRowVal(row, ['Longitude', 'Lng']));
        const wikiUrl = String(getRowVal(row, ['Venue Wiki', 'Wiki', 'Wikipedia']) || '').trim();

        if (!venueName || isNaN(lat) || isNaN(lng) || !college) return;
        const vObj = { conference: conf, college, mascot, venue: venueName, venueCity, capacity, notes, coords: [lat, lng], wikiUrl };
        venues.push(vObj);

        if (!conferenceGrouped[conf]) conferenceGrouped[conf] = [];
        conferenceGrouped[conf].push(vObj);
      });

      renderSidebarTree(conferenceGrouped);
      if (scheduleLoaded) {
        applyScheduleToVenues();
      }
      updateMapFilters();
      if (nextHomeLookupLoaded) {
        assignNextHomeGamesToVenues();
      }
    };

    /* Collapsible Home Games Date Section */
    document.getElementById('home-games-dropdown-toggle').addEventListener('click', () => {
      const bodyEl = document.getElementById('home-games-dropdown-body');
      const arrowEl = document.getElementById('home-games-dropdown-arrow');
      const isHidden = bodyEl.style.display === 'none';
      bodyEl.style.display = isHidden ? 'flex' : 'none';
      arrowEl.textContent = isHidden ? '▲' : '▼';
    });

    /* Date & Reset Filter Buttons (preserve active conference filters) */
    document.getElementById('btn-today').addEventListener('click', async () => {
      const todayIso = formatIsoLocalDate(new Date());
      document.getElementById('date-start').value = todayIso;
      document.getElementById('date-end').value = '';
      setDateFilterState('today');
      document.getElementById('active-count').textContent = "Checking today's games...";
      await fetchScoreboardsForRange(todayIso, todayIso, 'Today');
    });

    document.getElementById('btn-next-3-days').addEventListener('click', async () => {
      const startDt = new Date();
      const endDt = new Date();
      endDt.setDate(endDt.getDate() + 2);
      const startIso = formatIsoLocalDate(startDt);
      const endIso = formatIsoLocalDate(endDt);
      document.getElementById('date-start').value = startIso;
      document.getElementById('date-end').value = endIso;
      setDateFilterState('next3');
      document.getElementById('active-count').textContent = "Checking Next 3 Days...";
      await fetchScoreboardsForRange(startIso, endIso, 'Next 3 Days');
    });

    document.getElementById('btn-reset-dates').addEventListener('click', () => {
      clearDateSelectionState();
      applyScheduleToVenues();
      updateMapFilters();
      zoomMapToScope();
      resetRightPanel();
    });

    document.getElementById('btn-apply-dates').addEventListener('click', async () => {
      const startVal = document.getElementById('date-start').value;
      const endVal = document.getElementById('date-end').value || startVal;
      if (!startVal) return;
      const label = startVal === endVal ? startVal : `${startVal} to ${endVal}`;
      setDateFilterState('custom');
      document.getElementById('active-count').textContent = `Checking ${label}...`;
      await fetchScoreboardsForRange(startVal, endVal, label);
    });

    fetchNextHomeGamesForAllVenues();

    /* Navigation Listeners */
    document.getElementById('back-to-conf-btn').addEventListener('click', () => {
      map.setView([39.8283, -98.5795], getNationalZoom());
      resetRightPanel();
    });

    document.getElementById('prev-venue-btn').addEventListener('click', () => {
      if (currentFilteredVenues.length === 0) return;
      if (currentVenueIndex === -1) {
        currentVenueIndex = currentFilteredVenues.length - 1;
      } else {
        currentVenueIndex = (currentVenueIndex - 1 + currentFilteredVenues.length) % currentFilteredVenues.length;
      }
      const v = currentFilteredVenues[currentVenueIndex];
      map.flyTo(v.coords, 15, { duration: 0.8 });
      if (markersMap[v.college]) markersMap[v.college].openPopup();
      showVenueDetails(v, currentVenueIndex);
    });

    document.getElementById('next-venue-btn').addEventListener('click', () => {
      if (currentFilteredVenues.length === 0) return;
      if (currentVenueIndex === -1) {
        currentVenueIndex = 0;
      } else {
        currentVenueIndex = (currentVenueIndex + 1) % currentFilteredVenues.length;
      }
      const v = currentFilteredVenues[currentVenueIndex];
      map.flyTo(v.coords, 15, { duration: 0.8 });
      if (markersMap[v.college]) markersMap[v.college].openPopup();
      showVenueDetails(v, currentVenueIndex);
    });

    const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=responseHandler:handleGvizResponse`;
    const script = document.createElement('script');
    script.src = gvizUrl;
    document.body.appendChild(script);

    map.on('zoomend', updateBasemapForZoom);
  </script>
</body>
</html>
